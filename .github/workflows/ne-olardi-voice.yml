name: Ne olardi voice

# (yenidən yoxlama)
# Səsləndirmə Microsoft Edge neural səsləri ilə bişirilir. Bulud mühiti səs
# xidmətinə qoşula bilmir, ona görə runner bunu edir və nəticəni bu branch-a
# geri commit edir (meditation/bake-voice.yml ilə eyni yanaşma).
on:
  push:
    branches: [ne-olardi-voice]
    paths:
      - 'voice/lines/**'
      - 'voice/bake.py'
      - '.github/workflows/ne-olardi-voice.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ne-olardi-voice
  cancel-in-progress: false

jobs:
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ne-olardi-voice
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install and find a working client
        run: |
          mkdir -p voice/out
          pip install -U edge-tts
          PKG=$(python -c "import edge_tts,os;print(os.path.dirname(edge_tts.__file__))")
          if python voice/probe.py; then echo "pypi ok" >> voice/out/probe.txt; exit 0; fi
          echo "pypi fail" >> voice/out/probe.txt
          pip install -q --force-reinstall "git+https://github.com/rany2/edge-tts.git" || true
          PKG=$(python -c "import edge_tts,os;print(os.path.dirname(edge_tts.__file__))")
          grep -n "CHROMIUM_FULL_VERSION =" $PKG/constants.py >> voice/out/probe.txt || true
          if python voice/probe.py; then echo "master ok" >> voice/out/probe.txt; exit 0; fi
          echo "master fail" >> voice/out/probe.txt
          for v in 146.0.3856.62 148.0.3967.54 150.0.4078.48 152.0.4166.40 141.0.3537.85; do
            sed -i -E "s/CHROMIUM_FULL_VERSION = \"[0-9.]+\"/CHROMIUM_FULL_VERSION = \"$v\"/" $PKG/constants.py
            if python voice/probe.py; then echo "version ok $v" >> voice/out/probe.txt; exit 0; fi
            echo "version fail $v" >> voice/out/probe.txt
          done
          exit 0
      - name: Bake
        run: python voice/bake.py voice/lines/*.json || true
      - name: Commit audio
        if: always()
        run: |
          git config user.name "ne-olardi-voice-bot"
          git config user.email "ne-olardi-voice-bot@users.noreply.github.com"
          git add -A voice/out
          if git diff --cached --quiet; then echo "No audio changes."; exit 0; fi
          git commit -m "Bake narration audio"
          for i in 1 2 3 4 5; do
            git pull --rebase origin ne-olardi-voice && git push origin HEAD:ne-olardi-voice && exit 0
            sleep $((i * 5))
          done
          exit 1
