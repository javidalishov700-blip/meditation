name: Bake voice

# Narration MP3s are baked with Microsoft Edge neural voices. The cloud dev
# sandbox cannot reach the speech service, so the runner does it and commits
# the result back to the branch that triggered it.
on:
  push:
    paths:
      - 'src/lib/med-scripts.ts'
      - 'src/lib/copy.ts'
      - 'src/lib/copy-locales.ts'
      - 'src/lib/content.ts'
      - 'src/lib/library.ts'
      - 'src/lib/voice-lines.ts'
      - 'src/lib/content-natural.ts'
      - 'src/lib/content-long.ts'
      - 'scripts/bake-med-edge.py'
      - 'scripts/dump-voice-clips.ts'
      - 'scripts/voice-durations.py'
      - '.github/workflows/bake-voice.yml'
  workflow_dispatch:
    inputs:
      kinds:
        description: 'Clip kinds to bake (med, lib, prog, quote, sos, ui, sample)'
        default: 'med,sample'

permissions:
  contents: write

concurrency:
  group: bake-voice-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tools
        run: |
          npm ci --ignore-scripts
          pip install edge-tts==7.2.8 numpy==2.1.3
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Bake (only clips whose text changed are synthesised)
        env:
          KINDS: ${{ github.event.inputs.kinds || 'med,sample' }}
        run: |
          npx tsx scripts/dump-voice-clips.ts "$RUNNER_TEMP/main.json" "$KINDS"
          python scripts/bake-med-edge.py "$RUNNER_TEMP/main.json"
          # Stories, practices and program days in every narrated language.
          npx tsx scripts/dump-voice-clips.ts "$RUNNER_TEMP/lib-prog.json" lib,prog
          python scripts/bake-med-edge.py "$RUNNER_TEMP/lib-prog.json"
          # SOS and UI cues in these languages are Edge voices too; keep them
          # in the same calm tone as the meditations.
          npx tsx scripts/dump-voice-clips.ts "$RUNNER_TEMP/cues.json" sos,ui
          python scripts/bake-med-edge.py "$RUNNER_TEMP/cues.json" --langs=az,ru,it

      - name: Measure narration lengths
        # The "N min" labels in the app come from the audio that was baked.
        if: always()
        run: python scripts/voice-durations.py

      - name: Commit audio
        # Keep whatever did bake even if a few clips failed; a re-run fills the rest.
        if: always()
        run: |
          git config user.name "steady-voice-bot"
          git config user.email "steady-voice-bot@users.noreply.github.com"
          git add -A public/voice src/lib/voice-durations.ts
          if git diff --cached --quiet; then
            echo "No audio changes."
            exit 0
          fi
          git commit -m "Re-bake narration audio for changed texts"
          for i in 1 2 3 4 5; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          exit 1
