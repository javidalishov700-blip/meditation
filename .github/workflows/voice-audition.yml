name: Voice audition

# Short samples of candidate narrator voices, committed to store/voice-audition
# so they can be listened to before a voice is chosen. Not part of the app.
on:
  push:
    paths:
      - 'scripts/voice-audition.py'
      - '.github/workflows/voice-audition.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: voice-audition-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audition:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tools
        run: |
          npm ci --ignore-scripts
          pip install edge-tts==7.2.8 numpy==2.1.3
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Read the samples
        run: |
          npx tsx scripts/dump-voice-clips.ts "$RUNNER_TEMP/med.json" med
          python scripts/voice-audition.py "$RUNNER_TEMP/med.json"

      - name: Commit samples
        run: |
          git config user.name "steady-voice-bot"
          git config user.email "steady-voice-bot@users.noreply.github.com"
          git add -A store/voice-audition
          if git diff --cached --quiet; then
            echo "No samples changed."
            exit 0
          fi
          git commit -m "Voice audition samples"
          for i in 1 2 3 4 5; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          exit 1
