name: Voice pin test

# Temporary: which request envelope keeps a multilingual voice in Turkish.
on:
  push:
    paths:
      - 'scripts/voice-pin-test.py'
      - '.github/workflows/voice-pin-test.yml'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tools
        run: |
          pip install edge-tts==7.2.8 numpy==2.1.3
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Try envelopes
        run: python scripts/voice-pin-test.py
      - name: Commit samples
        run: |
          git config user.name "steady-voice-bot"
          git config user.email "steady-voice-bot@users.noreply.github.com"
          git add -A store/voice-test
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Voice pin test samples"
          for i in 1 2 3 4 5; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 5))
          done
          exit 1
