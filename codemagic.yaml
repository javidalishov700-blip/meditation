workflows:
  web-check:
    name: Web build (Apple gerekmez)
    max_build_duration: 20
    instance_type: mac_mini_m2
    environment:
      node: 22
    scripts:
      - name: Install
        script: npm ci
      - name: Lint
        script: npm run lint
      - name: Build
        script: npm run build
    artifacts:
      - dist/**

  ios-testflight:
    name: iOS TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: app.steady.calm
      vars:
        XCODE_WORKSPACE: App.xcworkspace
        XCODE_SCHEME: App
        BUNDLE_ID: app.steady.calm
      node: 22
      xcode: latest
      cocoapods: default
    cache:
      cache_paths:
        - $HOME/.npm
        - public/voice/clips
    scripts:
      - name: Install npm
        script: npm ci
      - name: Bake store MP3s
        script: |
          if [ -n "$OPENAI_API_KEY" ]; then
            npm run bake-voice
          else
            echo "OPENAI_API_KEY unset — IPA will have no baked voice clips"
          fi
      - name: Build web
        script: npm run build
      - name: Add iOS platform
        script: |
          if [ ! -d ios ]; then
            npx cap add ios
          fi
          npx cap sync ios
          node scripts/patch-native-locales.mjs
      - name: CocoaPods
        script: cd ios/App && pod install
      - name: Code signing
        script: xcode-project use-profiles
      - name: Build IPA
        script: |
          cd ios/App
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
